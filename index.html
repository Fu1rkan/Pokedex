<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="./style/style.css">
    <link rel="icon" type="image/png" href="./img/pokeball.png">
</head>
<body onload="loadPokemon()" id="my-body">
    <header>

        <nav>
            <h1><a href="#">Pokedex</a></h1>
            <label for="search-bar">
                <input type="text" placeholder="name" id="search-bar" onkeyup="searchPokemon()">
                <p class="d_none" id="check-letters">min. 3 Letters</p>
            </label>
        </nav>

    </header>

    <main>

        <section class="pokemon_cards_overlay" id="pokemon-cards-overlay">
            <h2 class="d_none" id="no-results">No Results</h2>
        </section>

        <section class="load_more_pokemons" id="load-more-pokemons">
            <button class="load_more_button" onclick="loadMorePokemons()">load more</button>
        </section>

        <section class="main_pokemon_overlay_bg d_none" id="main-pokemon-overlay">
            <div id="bleur-overlay"></div>
        </section>

        <section class="loading_screen d_none" id="loading-screen">
            <div class="loading_spinner">
                <img src="./img/pokeball.png" alt="">
                <div class="loading_bar" id="loading-bar">
                    <div class="loading_progress" style="width: 0%" id="loading-progress"></div>
                    <p id="progress" class="t_bold">0%</p>
                </div>
            </div>
        </section>
        
    </main>

    <footer>
        <h2><a href="#">Pokedex</a></h2>
        <section class="social_media">
            <a target="_blank" href="https://www.facebook.com/profile.php?id=100007381268672&locale=de_DE"><img src="./img/social_media/facebook.png" alt=""></a>
            <a target="_blank" href="https://www.instagram.com/fuu1rkan/"><img src="./img/social_media/instagram.png" alt=""></a>
            <a target="_blank" href="https://github.com/Fu1rkan"><img src="./img/social_media/github.png" alt=""></a>
            <a target="_blank" href="https://www.linkedin.com/in/Fu1rkan/"><img src="./img/social_media/linkedin.png" alt=""></a>
            <a target="_blank" href="https://x.com/Fuu1rkan"><img src="./img/social_media/x.png" alt=""></a>
        </section>
    </footer>

    <script src="./script/pokemon_overlay.js"></script>
    <script src="./script/script.js"></script>
    <script src="./script/template.js"></script>
    <script src="./script/evo_chain.js"></script>
    <script src="./script/load_pokemons.js"></script>
    <script src="./script/types.js"></script>
    <script src="./script/search_pokemons.js"></script>
</body>
</html>
