<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <script src="./script/filter.js"></script>
    <script src="./script/script.js"></script>
    <script src="./script/template.js"></script>

    <link rel="stylesheet" href="./style/style.css">
</head>
<body onload="loadPokemon()">
    <header>
        <nav>
            <h1><a href="#">Pokedex</a></h1>
            <label for="">
                <input type="text" placeholder="name">
                <button>
                    <img src="./img/search.png" alt="" class="search_logo">
                </button>
            </label>
            
        </nav>
    </header>

    <main>
 
        <section class="pokemon_cards_overlay" id="pokemon-cards-overlay">
        </section>

        <section class="resp_pokemon_overlay_bg d_none" id="main-pokemon-overlay">
        </section>        
        
    </main>

    <footer>
        <h2><a href="#">Pokedex</a></h2>
        <section class="social_media">
            <img src="./img/social_media/facebook.png" alt="">
            <img src="./img/social_media/instagram.png" alt="">
            <img src="./img/social_media/github.png" alt="">
            <img src="./img/social_media/linkedin.png" alt="">
            <img src="./img/social_media/x.png" alt="">
        </section>
    </footer>

    <script src="./script/pokemon_overlay.js"></script>
</body>
</html>
